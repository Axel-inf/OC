{% extends "base.html" %}
{% if assignment %}
  {% set page_title = "Modifier le devoir" %}
{% else %}
  {% set page_title = "Nouveau devoir" %}
{% endif %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<h2 class="mb-3">{{ page_title }}</h2>

<form method="post" class="row g-3">
  <div class="col-12">
    <label for="title" class="form-label">Titre</label>
    <input
      type="text"
      name="title"
      id="title"
      class="form-control"
      required
      value="{{ assignment.title if assignment else '' }}"
    />
  </div>

  <div class="col-12">
    <label for="description" class="form-label">Description</label>
    <textarea
      name="description"
      id="description"
      rows="3"
      class="form-control"
    >{{ assignment.description if assignment else '' }}</textarea>
  </div>

  <div class="col-md-6">
    <label for="course_id" class="form-label">Matière / cours</label>
    <select
      name="course_id"
      id="course_id"
      class="form-select"
      required
    >
      <option value="">Choisir un cours...</option>
      {% for c in courses %}
      <option
        value="{{ c.id }}"
        {% if assignment and assignment.course_id == c.id %}selected{% endif %}
      >
        {{ c.name }}{% if c.teacher %} ({{ c.teacher.last_name }}){% endif %}
      </option>
      {% endfor %}
    </select>
  </div>

  <div class="col-md-3">
    <label for="due_date" class="form-label">Date de rendu</label>
    <input
      type="date"
      name="due_date"
      id="due_date"
      class="form-control"
      required
      value="{% if assignment %}{{ assignment.due_date.strftime('%Y-%m-%d') }}{% endif %}"
    />
  </div>

  <div class="col-md-3">
    <label for="estimated_minutes" class="form-label">Temps estimé (min)</label>
    <input
      type="number"
      name="estimated_minutes"
      id="estimated_minutes"
      class="form-control"
      min="5"
      step="5"
      value="{{ assignment.estimated_minutes if assignment else 30 }}"
    />
  </div>

  <div class="col-12 mt-4">
    <button type="submit" class="btn btn-primary me-2">
      Enregistrer
    </button>
    <a href="{{ url_for('devoirs_list') }}" class="btn btn-secondary">
      Annuler
    </a>
  </div>
</form>
{% endblock %}
